name: 문제 신고
description: 앱을 사용하면서 발생한 문제를 알려 주세요.
title: "[문제] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        불편을 겪은 상황을 편하게 적어 주세요. 선택 항목은 잘 모르면 비워 두셔도 됩니다.
        이 내용은 공개됩니다. 계정 정보나 실제 일정 등 개인정보는 글과 이미지에서 가려 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 발생했나요?
      description: 문제가 생긴 상황과 화면에서 보인 현상을 알려 주세요.
      placeholder: "예: 달력에서 다음 달 버튼을 눌렀는데 날짜가 바뀌지 않아요."
    validations:
      required: true
  - type: textarea
    id: steps-and-expected
    attributes:
      label: 재현 방법과 기대한 동작
      description: 가능하다면 문제 직전에 한 행동과 원래 기대한 결과를 알려 주세요.
      placeholder: |
        예: 설정을 닫고 다음 달 버튼을 두 번 눌렀어요.
        다음 달의 날짜와 일정이 표시될 것으로 기대했어요.
  - type: input
    id: app-version
    attributes:
      label: 앱 버전
      description: 설정 → 앱 정보에서 확인할 수 있습니다.
      placeholder: "예: 0.1.1"
  - type: dropdown
    id: windows-version
    attributes:
      label: Windows 버전
      options:
        - Windows 11
        - Windows 10
        - 잘 모르겠음
  - type: textarea
    id: attachments
    attributes:
      label: 스크린샷 또는 추가 설명
      description: 필요한 경우 이미지나 파일을 이 칸에 끌어 놓아 첨부할 수 있습니다. 개인정보는 가려 주세요.
      placeholder: "화면에서 보인 오류 문구나 추가로 알려 주고 싶은 내용을 적어 주세요."
